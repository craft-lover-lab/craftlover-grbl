<svg xmlns="http://www.w3.org/2000/svg" width="120mm" height="80mm" viewBox="0 0 120 80">
  <style>.score { stroke: #2f7cf6; fill: none; stroke-width: 0.3 }</style>
  <!-- outer cut line: red stroke -->
  <rect x="2" y="2" width="116" height="76" rx="5" fill="none" stroke="#e5243b" stroke-width="0.2"/>
  <!-- score lines via a CSS class -->
  <line class="score" x1="10" y1="40" x2="110" y2="40"/>
  <g class="score"><circle cx="60" cy="20" r="8"/></g>
  <!-- fill-only shapes inherit the group's fill: engrave -->
  <g fill="black">
    <rect x="15" y="50" width="20" height="20"/>
    <path d="M45 70 L55 50 L65 70 Z"/>
  </g>
  <!-- currentColor from the parent -->
  <g style="color: #18a058"><rect x="80" y="50" width="25" height="20" fill="none" stroke="currentColor"/></g>
  <!-- invisible: must be ignored -->
  <rect x="0" y="0" width="5" height="5" fill="none" stroke="none"/>
  <rect x="0" y="0" width="5" height="5" style="display:none" stroke="red"/>
</svg>
